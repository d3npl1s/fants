<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#21265c">
<title>Фанты — правда или действие</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-level="fun">

  <!-- ══════════ Шапка ══════════ -->
  <header class="topbar">
    <button class="crown-btn" id="crownBtn" aria-label="Премиум">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M4 17.5 3 8l5 3.5L12 5l4 6.5L21 8l-1 9.5z"/>
      </svg>
    </button>
    <button class="dots-btn" id="menuBtn" aria-label="Меню">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- ══════════ Экран: карусель уровней ══════════ -->
  <section class="screen" id="screen-levels">
    <div class="carousel" id="carousel">
      <div class="car-track" id="carTrack"><!-- карточки генерируются из data --></div>
    </div>
    <div class="dots" id="carDots"></div>
  </section>

  <!-- ══════════ Экран: игроки ══════════ -->
  <section class="screen screen-solid" id="screen-setup">
    <h2 class="setup-title">Игроки</h2>
    <p class="setup-sub">Минимум 2 игрока. Имена появятся на колесе.</p>
    <div id="playerList" class="player-list"></div>
    <button class="ghost-btn" id="addPlayerBtn">＋ Добавить игрока</button>
    <div class="setup-actions">
      <button class="back-link" id="setupBackBtn">← Назад</button>
      <button class="play-btn small" id="setupSaveBtn"><span>Играть</span><i class="chev">›</i></button>
    </div>
  </section>

  <!-- ══════════ Экран: колесо ══════════ -->
  <section class="screen screen-wheel" id="screen-wheel">
    <div class="wheel-bg">
      <div class="stripe s1"></div>
      <div class="stripe s2"></div>
      <div class="stripe s3"></div>
    </div>
    <button class="spin-big-btn" id="spinBtn" aria-label="Запустить колесо">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>
      </svg>
    </button>
    <p class="wheel-caption">Запустите колесо!</p>
  </section>

  <!-- ══════════ Экран: задание ══════════ -->
  <section class="screen screen-reveal" id="screen-reveal">
    <div class="reveal-inner">
      <h1 class="reveal-type" id="revealType">действие</h1>
      <div class="reveal-divider"></div>
      <p class="reveal-text" id="revealText"></p>
    </div>
    <button class="done-btn" id="doneBtn">Готово! Крутим дальше ›</button>
    <aside class="side-panel">
      <div class="panel-card timer-card" id="timerCard" title="Время на выполнение">
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      </div>
      <div class="panel-card">
        <button class="panel-btn" id="soundBtn" aria-label="Звук">
          <svg id="soundOnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <svg id="soundOffIcon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>
        </button>
      </div>
    </aside>
  </section>

  <!-- ══════════ Оверлей: спин колеса ══════════ -->
  <div id="spinOverlay" class="spin-overlay hidden">
    <div class="spin-rot">
      <div class="spin-stripe ps1"></div>
      <div class="spin-stripe ps2"></div>
      <div class="spin-stripe ps3"></div>
      <div class="spin-track" id="spinTrack"></div>
    </div>
  </div>

  <!-- ══════════ Модалка: настройки ══════════ -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <h3>Настройки</h3>
      <div class="set-row">
        <span>Уровень</span>
        <div class="level-chips" id="levelChips"></div>
      </div>
      <button class="set-row set-btn" id="setPlayersBtn">
        <span>Игроки</span><b id="setPlayersCount">0</b>
      </button>
      <button class="set-row set-btn" id="setSoundBtn">
        <span>Звук</span><b id="setSoundState">Вкл</b>
      </button>
      <button class="set-row set-btn" id="setMenuBtn">
        <span>К выбору уровня</span>
      </button>
      <p class="set-foot">Домашняя реплика «Фантов» для своих. Некоммерческая 💙</p>
      <button class="modal-close" id="settingsCloseBtn">Закрыть</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
